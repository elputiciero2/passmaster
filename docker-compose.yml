# Levanta todo el sistema: docker compose up --build
#
# Las contraseñas y secretos tienen valores de desarrollo para que funcione sin configurar nada.
# Para un despliegue real, defínalos en un archivo .env junto a este (no se sube al repositorio):
#   DB_ROOT_PASSWORD, DB_PASSWORD, JWT_SECRET, QR_HMAC_SECRET
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-passmaster_root_dev}
      # Usuario de la aplicación: solo tiene permisos sobre passmaster_db
      MYSQL_DATABASE: passmaster_db
      MYSQL_USER: passmaster
      MYSQL_PASSWORD: ${DB_PASSWORD:-passmaster_app_dev}
    volumes:
      - db_data:/var/lib/mysql
      # Se ejecuta solo la primera vez (volumen vacío): crea la base y las tablas
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # Por TCP a propósito: durante la inicialización MySQL no acepta red, así no da "sano" antes de tiempo
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Sin puertos publicados: la base de datos y la API solo son alcanzables a través de nginx
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: 1
      CLIENT_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: passmaster
      DB_PASSWORD: ${DB_PASSWORD:-passmaster_app_dev}
      DB_NAME: passmaster_db
      JWT_SECRET: ${JWT_SECRET:-passmaster_jwt_secret_solo_para_desarrollo_local}
      JWT_EXPIRES_IN: 7d
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:-passmaster_qr_hmac_secret_solo_para_desarrollo}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
