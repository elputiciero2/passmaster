# Levanta todo el sistema: docker compose up --build
# Credenciales de desarrollo; cámbialas antes de exponer esto fuera de tu máquina.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: passmaster_root
    volumes:
      - db_data:/var/lib/mysql
      # Se ejecuta solo la primera vez (volumen vacío): crea la base y las tablas
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # Por TCP a propósito: durante la inicialización MySQL no acepta red, así no da "sano" antes de tiempo
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: passmaster_root
      DB_NAME: passmaster_db
      JWT_SECRET: passmaster_jwt_secret_dev
      JWT_EXPIRES_IN: 7d
      QR_HMAC_SECRET: passmaster_qr_hmac_secret_dev
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
