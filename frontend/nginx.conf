server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 50k;

  # Cabeceras de seguridad para la web. La CSP limita qué puede cargar o ejecutar la página,
  # de modo que un script inyectado no pueda robar la sesión guardada en el navegador.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  # Mismo origen para web y API: el navegador nunca habla directo con el backend
  location /api/ {
    proxy_pass http://backend:5000;
    # Se sobrescribe (no se añade) para que el cliente no pueda falsificar su IP ante los límites de peticiones
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
